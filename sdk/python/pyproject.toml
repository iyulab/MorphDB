[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "morphdb"
version = "0.13.0"
description = "Official Python client SDK for MorphDB - a PostgreSQL-based dynamic schema database service"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "iyulab" }
]
keywords = [
    "morphdb",
    "database",
    "sdk",
    "client",
    "postgresql",
    "dynamic-schema"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
dependencies = [
    "httpx>=0.26.0",
    "signalrcore>=0.9.5",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0"
]

[project.urls]
Homepage = "https://github.com/iyulab/morphdb"
Repository = "https://github.com/iyulab/morphdb.git"

[tool.hatch.build.targets.wheel]
packages = ["morphdb"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require running server)",
]
# By default, skip integration tests (run with: pytest -m integration)
addopts = "-m 'not integration'"
