# The development bundle: builds the service from this checkout and runs the stores beside it.
# It is not the quick-start in README.md, which pulls the published image -- copy that one to run
# MorphDB; use this one to work on it. `docker compose up -d postgres` gives a database for
# `dotnet run`; `docker compose --profile app up -d` also builds and runs the service.
#
# Host ports are overridable so two checkouts (or this and something else on 5432/6379) can run
# side by side: MORPHDB_PORT, MORPHDB_PG_PORT, MORPHDB_REDIS_PORT, MORPHDB_PGADMIN_PORT. Containers
# carry no fixed name for the same reason -- `docker compose -p <name>` isolates a second copy.
services:
  # MorphDB API Service
  api:
    build:
      context: .
      dockerfile: src/MorphDB.Service/Dockerfile
    ports:
      # Loopback on purpose: nothing here authenticates. To serve other machines, front the
      # service with a reverse proxy (or your app) and bind that instead.
      - "127.0.0.1:${MORPHDB_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MorphDB: Host=postgres;Port=5432;Database=morphdb;Username=morph;Password=morph
    depends_on:
      postgres:
        condition: service_healthy
    # No healthcheck override: the image defines its own, and a second definition here is a second
    # thing to get wrong — this one called curl, which the image does not have either.
    profiles:
      - app

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${MORPHDB_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: morph
      POSTGRES_PASSWORD: morph
      POSTGRES_DB: morphdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morph -d morphdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${MORPHDB_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:9.17
    ports:
      - "127.0.0.1:${MORPHDB_PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@morphdb.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
