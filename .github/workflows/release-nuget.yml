name: Release NuGet Packages

on:
  push:
    branches: [main]
    paths:
      - 'Directory.Build.props'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push the release tag
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from Directory.Build.props
        id: version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' Directory.Build.props)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read <Version> from Directory.Build.props"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      # A release nobody wrote down is one the repository cannot answer questions about later.
      # This gate runs *before* anything is published: a missing section fails the run while it is
      # still free to fix. Checked after the push it could only be a warning, and a warning about
      # an already-published version is exactly the record gap this step exists to close.
      - name: Verify the changelog records this version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v heading="## $VERSION" '
            $0 == heading { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section. Record the release before publishing it."
            exit 1
          fi
          echo "Release notes: $(wc -l < "$RUNNER_TEMP/release-notes.md") lines"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Gate the release on a green suite — publishing is irreversible (NuGet can only unlist),
      # so the gate has to live inside the publish path itself, not in ci.yml racing alongside.
      # Tests are Testcontainers-self-sufficient; ubuntu-latest provides the Docker they need.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output ./nupkgs /p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Push to NuGet.org
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push to GitHub Packages
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/iyulab/index.json --skip-duplicate

      # Without this the repository has no record of what was released: packages and images carried
      # version numbers while the newest git tag stayed at v0.2.1, so anyone reading the repo to pick
      # a version to pin found one that was several minor releases old. Only this workflow tags —
      # release-docker.yml runs on the same trigger and would race for the same name.
      - name: Tag the released version
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists, leaving it alone."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      # The other half of the same record. Packages and the tag are automated while the release
      # notes were written by hand, and a hand step is the one that eventually gets skipped —
      # the releases here are complete only because someone remembered every time. This removes
      # the remembering. Same workflow-ownership rule as the tag: only this one publishes.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it alone."
            exit 0
          fi
          gh release create "$TAG" \
            --title "MorphDB ${{ steps.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
