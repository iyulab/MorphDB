name: Release NuGet Packages

# A release runs on a commit CI has already passed, and only then: CI is the gate, whole. This
# workflow used to fire on the push that changed Directory.Build.props, beside CI rather than after
# it, and test with a subset of what CI checks -- so 0.17.0 was published from a commit whose
# formatting, Native AOT and API suites were red. Now every green CI run on main or a hotfix branch
# asks one question: does the version Directory.Build.props holds still need publishing? Usually
# not, and the run ends there. The bump commit answers yes; so does a later fix of a bump whose CI
# was red, which is how a failed release recovers without a manual step.
#
# A manual run is a dry run: it builds, tests and packs the checked-out commit and publishes nothing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, 'hotfix/**']
  workflow_dispatch:

# Never cancelled, unlike CI: publishing is not something to interrupt halfway. The group serialises
# runs instead, so two green CI runs in quick succession publish one after the other rather than
# racing for the same version. The image workflow beside this one already reads this way.
concurrency:
  group: release-nuget
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  pack:
    # A CI run for a pull request, or one that did not pass, releases nothing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      any: ${{ steps.unpublished.outputs.any }}

    steps:
      # The commit CI passed, not whatever the branch points at by now.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read version from Directory.Build.props
        id: version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' Directory.Build.props)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read <Version> from Directory.Build.props"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      # A release nobody wrote down is one the repository cannot answer questions about later.
      # This gate runs *before* anything is published: a missing section fails the run while it is
      # still free to fix. Checked after the push it could only be a warning, and a warning about
      # an already-published version is exactly the record gap this step exists to close.
      - name: Verify the changelog records this version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v heading="## $VERSION" '
            $0 == heading { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          # -s is not the test: a heading followed by a blank line leaves a file that is
          # non-empty and says nothing, which would publish a release whose notes are one
          # newline. The section has to carry a character worth reading.
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md records no content under '## $VERSION'. Record the release before publishing it."
            exit 1
          fi
          echo "Release notes: $(wc -l < "$RUNNER_TEMP/release-notes.md") lines"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # A release run is on a commit CI passed (see the trigger), so it does not test again. A manual
      # run has no such commit behind it, and tests.
      - name: Test
        if: github.event_name == 'workflow_dispatch'
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output ./nupkgs /p:PackageVersion=${{ steps.version.outputs.version }}

      # Most green CI runs carry a version that is already out; this is where they stop. Every
      # package is asked, and an index that cannot be asked fails the run rather than reading as
      # "not published" (see the action).
      - name: Find the packages nuget.org does not have yet
        id: unpublished
        uses: iyulab/dotnet-ci-actions/nuget-unpublished@92c282e839be5e4957fd68fe763b7acc3d088f06 # main, 2026-10-07
        with:
          version: ${{ steps.version.outputs.version }}

      # The hand-over to the publish job below. Only the packages go in this artifact, and nothing
      # else: the central workflow refuses an artifact that holds any other file. A manual run is a
      # dry run and hands nothing over.
      - name: Upload the packages
        if: github.event_name == 'workflow_run' && steps.unpublished.outputs.any == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            nupkgs/*.nupkg
            nupkgs/*.snupkg
          retention-days: 1
          if-no-files-found: error

      - name: Upload the release notes
        if: github.event_name == 'workflow_run'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          retention-days: 1
          if-no-files-found: error

  # nuget.org is written by the organization's central publishing workflow, which holds the only
  # trust policy on nuget.org: this repository holds no NuGet key. The call waits for the push and
  # fails when it does not succeed, so the tag and the release below never describe a version that
  # is not out. The central workflow checks this repository, this workflow file and the package ids
  # against its allowlist, and refuses a pull request run.
  publish:
    needs: pack
    if: github.event_name == 'workflow_run' && needs.pack.outputs.any == 'true'
    uses: iyulab/nuget-publish/.github/workflows/request.yml@de1e58c8bcefaf88f497fcb58899a1c6e84f4e29 # main
    permissions: {}
    secrets: inherit

  release:
    needs: [pack, publish]
    # A version nuget.org already has skips the publish job, and the record below is still made
    # (each step leaves what exists alone); a failed publish records nothing.
    if: >-
      !cancelled() && github.event_name == 'workflow_run' && needs.pack.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write   # needed to push the release tag
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download the packages
        if: needs.pack.outputs.any == 'true'
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: nupkgs

      - name: Download the release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: ${{ runner.temp }}

      # --skip-duplicate stays as idempotence for a run that resumes a partial release. GitHub
      # Packages rejects snupkg, so only the .nupkg glob is pushed here.
      - name: Push to GitHub Packages
        if: needs.pack.outputs.any == 'true'
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/iyulab/index.json --skip-duplicate

      # Without this the repository has no record of what was released: packages and images carried
      # version numbers while the newest git tag stayed at v0.2.1, so anyone reading the repo to pick
      # a version to pin found one that was several minor releases old. Only this workflow tags —
      # release-docker.yml runs on the same trigger and would race for the same name.
      - name: Tag the released version
        run: |
          TAG="v${{ needs.pack.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists, leaving it alone."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      # The other half of the same record. Packages and the tag are automated while the release
      # notes were written by hand, and a hand step is the one that eventually gets skipped —
      # the releases here are complete only because someone remembered every time. This removes
      # the remembering. Same workflow-ownership rule as the tag: only this one publishes.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.pack.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it alone."
            exit 0
          fi
          gh release create "$TAG" \
            --title "MorphDB ${{ needs.pack.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
