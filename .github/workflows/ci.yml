name: CI

on:
  push:
    branches: [main, develop, 'hotfix/**']
  pull_request:
    branches: [main, develop]

# A newer push to the same ref supersedes an in-flight run. This suite is the expensive one — it
# starts its own containers and runs the whole of it — so a superseded run left going is minutes
# spent on a commit nobody is waiting for, out of a budget every pushed pipeline shares.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest

    # No service containers: the tests are Testcontainers-self-sufficient (the fixture starts its
    # own postgres and injects the connection string in-memory). The postgres/redis services and
    # ConnectionStrings env vars that used to sit here were leftovers no test ever read.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --coverlet --coverlet-output-format cobertura --results-directory ./coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          directory: ./coverage
          fail_ci_if_error: false

  # The desktop client's checks live in ci-desk.yml, which runs on changes under desk/ rather than
  # on every push. They were here so a red typecheck could not sit unnoticed at HEAD, and that is
  # still what they are for — but the client is parked (desk/README.md), so on a push that does not
  # touch it these checks were re-answering a question about code nobody changed, and their upkeep
  # was landing on whoever pushed next. Tying them to desk/ means they cost nothing while it is
  # parked and are back the moment it is touched.

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Published text must not name something only an insider can look up. Needs no dotnet, so
      # it runs before the SDK is set up and fails the job in seconds when it fails.
      - name: Internal token scan
        uses: iyulab/dotnet-ci-actions/internal-token-scan@7e501c0d46f7c06e73a8945f4b0f83fcb347eb53 # main, 2026-09-06
        with:
          min-files: '100'
          must-contain: 'API.md'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Run security scan
        uses: iyulab/dotnet-ci-actions/vulnerability-scan@00faf7ff62b88e11fbf88edfedcf73bdc5f2eebe # main, 2026-08-31

  # Packs the solution and checks what a package consumer receives: each package's contents
  # (XML documentation, readme, license) and whether the client README's quick start compiles
  # against exactly the packages that README tells a reader to install. The repository's own build
  # cannot see either: it compiles README code against nothing.
  package-consumer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Package consumer check
        uses: iyulab/dotnet-ci-actions/package-consumer-check@8ab06f352d8c3e31d8c7f56dae1ecc6c3a160ef6 # main, 2026-09-25
        with:
          project: MorphDB.sln
          readme: src/MorphDB.Client/README.md
          min-snippets: '1'
