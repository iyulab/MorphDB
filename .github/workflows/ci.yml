name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest

    # No service containers: the tests are Testcontainers-self-sufficient (the fixture starts its
    # own postgres and injects the connection string in-memory). The postgres/redis services and
    # ConnectionStrings env vars that used to sit here were leftovers no test ever read.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          fail_ci_if_error: false

  # release-desk.yml runs the same checks, but only on desk-v* tags and manual dispatch — which
  # meant a red typecheck sat unnoticed at HEAD until the moment someone tried to release (52
  # errors did exactly that). This job makes every push answer the question the release would ask.
  desk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: desk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desk/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Critical-level only, deliberately: the remaining highs need major bumps of the electron
      # toolchain (electron 33→43, vite 5→8) that electron-vite does not yet support — a gate that
      # is red on day one teaches everyone to ignore it. Tighten to high when those land.
      - name: Audit production-severity vulnerabilities
        run: npm audit --audit-level=critical

      - name: TypeScript check
        run: npm run typecheck

      - name: Test
        run: npm test

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Run security scan
        run: |
          dotnet tool install --global security-scan || true
          dotnet list package --vulnerable --include-transitive
