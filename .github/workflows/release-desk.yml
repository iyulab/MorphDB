name: Release Desktop App

# The desktop client is parked and this workflow is parked with it (desk/README.md). It kept a
# `desk-v*` tag trigger for a release that was never cut, which left the repository holding the
# client as if it were on its way out the door — a workflow that is armed and a component that is
# not shipping say two different things, and readers believe the workflow.
#
# What remains is a manual build: it produces installers as artifacts and publishes nothing, since
# the publish step below is still gated on a `desk-v*` ref and no such tag exists. Reviving the
# client means restoring the trigger these four lines replaced:
#
#     push:
#       tags:
#         - 'desk-v*.*.*'
#
# Only a `desk-v*` ref publishes; that is decided by the ref, so the dispatch takes no input — it
# used to offer a `publish` toggle that nothing ever read, which is a switch that reports a setting
# it does not have.
on:
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  release:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            args: --win
          - os: macos-latest
            platform: mac
            args: --mac
          - os: ubuntu-latest
            platform: linux
            args: --linux

    defaults:
      run:
        working-directory: desk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: desk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build Electron app
        run: npm run build

      # For tag-triggered releases: publish directly to GitHub Releases
      - name: Build and Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/desk-v')
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (uncomment when certificates are available)
          # CSC_LINK: ${{ secrets.MAC_CERTS }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          # Windows code signing (uncomment when certificates are available)
          # CSC_LINK: ${{ secrets.WIN_CERTS }}
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTS_PASSWORD }}

      # For manual/non-tag builds: just build without publishing
      - name: Build distribution (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/desk-v') }}
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload artifacts for non-tag builds
      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/desk-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            desk/dist/*.exe
            desk/dist/*.dmg
            desk/dist/*.AppImage
            desk/dist/*.yml
            desk/dist/*.blockmap
          retention-days: 7
