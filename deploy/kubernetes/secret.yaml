apiVersion: v1
kind: Secret
metadata:
  name: morphdb-secrets
  namespace: morphdb
  labels:
    app.kubernetes.io/name: morphdb
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # IMPORTANT: Replace these values in production!
  # Use `kubectl create secret generic morphdb-secrets --from-literal=...` for production
  ConnectionStrings__MorphDB: "Host=postgres.morphdb.svc.cluster.local;Port=5432;Database=morphdb;Username=morph;Password=CHANGE_ME_IN_PRODUCTION"
  Jwt__SecretKey: "CHANGE_ME_IN_PRODUCTION_USE_AT_LEAST_32_CHARACTER_SECRET_KEY"
